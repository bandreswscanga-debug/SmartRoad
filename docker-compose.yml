services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: smartroad_sos
      MYSQL_USER: smartroad
      MYSQL_PASSWORD: 
    volumes:
      - smartroad_mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - smartroad_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: 
      TOKEN_EXPIRES: 12h
      MYSQL_URL: mysql://smartroad:@db:3306/smartroad_sos
      CORS_ORIGIN: "*"
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartroad_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - smartroad_net

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - smartroad_net

  locust:
    image: locustio/locust:latest
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust:ro
    command: -f /mnt/locust/locustfile.py --host=http://nginx
    depends_on:
      - nginx
    networks:
      - smartroad_net

networks:
  smartroad_net:
    driver: bridge

volumes:
  smartroad_mysql_data:
